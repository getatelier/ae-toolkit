<!DOCTYPE html>
<html lang="en">

<title>AET Telemetry Panel</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        border: "hsl(var(--border))",
        input: "hsl(var(--input))",
        ring: "hsl(var(--ring))",
        background: "hsl(var(--background))",
        foreground: "hsl(var(--foreground))",
        primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
        secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
        destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
        muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
        accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
        card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
    },
  },
};
</script>
<style>
  :root {
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --primary: 240 5.9% 10%;
    --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%;
    --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%;
    --accent-foreground: 240 5.9% 10%;
    --destructive: 0 84.2% 60.2%;
    --destructive-foreground: 0 0% 98%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 240 10% 3.9%;

  * { border-color: hsl(var(--border)); }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
  @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ---------------- helpers ---------------- */

function fmtDuration(s) {
  if (s == null || isNaN(s)) return "—";
  if (s < 1) return `${Math.round(s * 1000)}ms`;
  if (s < 60) return `${s.toFixed(1)}s`;
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  if (m < 60) return `${m}m ${sec}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d.getTime()) ? iso : d.toLocaleString();
}
function basename(p) { return p ? p.split("/").pop() : "—"; }
function shortId(id) { return id && id.length > 12 ? id.slice(0, 8) + "…" : id; }
function fmtTokens(n) {
  if (n == null || isNaN(n)) return "—";
  if (n < 1000) return `${n}`;
  if (n < 1_000_000) return `${(n / 1000).toFixed(1)}k`;
  if (n < 1_000_000_000) return `${(n / 1_000_000).toFixed(2)}M`;
  return `${(n / 1_000_000_000).toFixed(2)}B`;
}
function fmtCost(c) {
  if (c == null || isNaN(c)) return "—";
  return `$${c.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function fmtAgo(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

// A no-summary run is live while its archive mtime is fresher than this;
// older activity means incomplete (lvp-01). Named constant, tuned by use.
const LIVE_FRESHNESS_MINUTES = 30;
function liveStatus(lastActivity) {
  const fresh = lastActivity != null && Date.now() - lastActivity < LIVE_FRESHNESS_MINUTES * 60 * 1000;
  return fresh ? "live" : "incomplete";
}

// Auto-refresh polling (lvp-02): while the tab is visible and any no-summary
// run has activity younger than POLL_ACTIVITY_MINUTES, poll /api/list every
// POLL_INTERVAL_MS and merge only new or changed run dirs into the run list.
const POLL_INTERVAL_MS = 5000;
const POLL_ACTIVITY_MINUTES = 60;

/* ---------------- parsing ---------------- */

function collectGroups(pairs) {
  // Group relevant files by their containing directory (= run dir).
  // Each pair is { rel: path relative to the archive root, ... }.
  const groups = new Map();
  let filesSeen = 0;
  for (const p of pairs) {
    const parts = p.rel.split("/");
    const name = parts.pop();
    if (parts.length === 0) continue;
    if (name !== "last-run.json" && !name.endsWith(".jsonl")) continue;
    if (name === "work-history.jsonl") continue; // queue history copy, not execution telemetry
    filesSeen++;
    const dir = parts.join("/");
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push({ ...p, name });
  }
  return { groups, filesSeen };
}

async function readInBatches(items, readText) {
  // A large archive can hold thousands of files; read in bounded chunks.
  for (let i = 0; i < items.length; i += 150) {
    const chunk = await Promise.all(items.slice(i, i + 150).map(readText));
    for (let j = 0; j < chunk.length; j++) items[i + j].text = chunk[j];
  }
}

async function parseTelemetryFiles(fileList) {
  // Folder-picker fallback: strip the picked root folder name from each path.
  const pairs = [];
  for (const file of fileList) {
    const rel = file.webkitRelativePath;
    if (!rel) continue;
    const parts = rel.split("/");
    parts.shift();
    pairs.push({ rel: parts.join("/"), file });
  }
  const { groups, filesSeen } = collectGroups(pairs);
  const allEntries = [];
  for (const entries of groups.values()) allEntries.push(...entries);
  await readInBatches(allEntries, e => e.file.text());
  return { ...buildRunsFromGroups(groups), filesSeen };
}

async function loadTelemetryFromApi(onProgress) {
  // Served mode: the bundled launcher exposes ~/.aet/telemetry over localhost.
  const listRes = await fetch("/api/list");
  if (!listRes.ok) throw new Error(`archive unavailable (${listRes.status})`);
  const { root, files, dirs } = await listRes.json();
  const { groups, filesSeen } = collectGroups(files.map(rel => ({ rel })));
  const allEntries = [];
  for (const entries of groups.values()) allEntries.push(...entries);
  let done = 0;
  await readInBatches(allEntries, async e => {
    const res = await fetch("/api/file?p=" + encodeURIComponent(e.rel));
    if (!res.ok) throw new Error(`cannot read ${e.rel}`);
    const text = await res.text();
    done++;
    if (onProgress && done % 300 === 0) onProgress(done, allEntries.length);
    return text;
  });
  return { ...buildRunsFromGroups(groups, dirs), filesSeen, root, dirs: dirs || [] };
}

function parseRunDir(dir) {
  const segments = dir.split("/");
  const dirName = segments[segments.length - 1];
  // Current layout: {project}/{date}/{run-id}/. Legacy layout: {project}/{date}-{run-id}/.
  const dateIdx = segments.findIndex(s => /^\d{4}-\d{2}-\d{2}/.test(s));
  const date = dateIdx >= 0 ? segments[dateIdx].slice(0, 10) : null;
  const project = (dateIdx >= 0 ? segments.slice(0, dateIdx) : segments.slice(0, -1)).join("/") || "(root)";
  return { dirName, date, project };
}

function buildRunsFromGroups(groups, dirList, bumpedDirs) {
  // dirList (served mode only): [{rel, mtime}] for every current-layout run
  // dir, including empty ones. mtime is seconds; lastActivity is ms.
  // bumpedDirs (lvp-02): dirs whose mtime advanced since the previous poll —
  // a no-summary run among them is live regardless of the freshness window.
  const dirMtimes = new Map();
  for (const d of dirList || []) dirMtimes.set(d.rel, d.mtime != null ? d.mtime * 1000 : null);
  const runs = [];
  let skippedLines = 0;
  for (const [dir, entries] of groups) {
    const { dirName, date, project } = parseRunDir(dir);
    let fileSummary = null;
    const summaries = [];   // run_summary records (legacy execution.log.jsonl)
    const records = [];
    for (const { name, text } of entries) {
      if (text == null) { skippedLines++; continue; }
      if (name === "last-run.json") {
        try { fileSummary = JSON.parse(text); } catch { skippedLines++; }
        continue;
      }
      for (const line of text.split("\n")) {
        const t = line.trim();
        if (!t) continue;
        let rec;
        try { rec = JSON.parse(t); } catch { skippedLines++; continue; }
        if (!rec || typeof rec.type !== "string") { skippedLines++; continue; }
        if (rec.type === "run_summary") summaries.push(rec);
        else records.push(rec);
      }
    }

    if (fileSummary || summaries.length <= 1) {
      // Standard layout: one run per directory.
      const summary = fileSummary || summaries[0] || null;
      if (summary || records.length > 0) {
        runs.push(buildRun({
          dir, runId: dirName, date, project,
          summary,
          summaryCount: summaries.length + (fileSummary ? 1 : 0),
          records,
          lastActivity: dirMtimes.has(dir) ? dirMtimes.get(dir) : undefined,
          bumped: bumpedDirs ? bumpedDirs.has(dir) : false,
        }));
      }
    } else {
      // Legacy layout: execution.log.jsonl holds one run_summary per run.
      for (const s of summaries) {
        const id = s.run_id || dirName;
        runs.push(buildRun({
          dir: `${dir}#${id}`, runId: id, date, project,
          summary: s, summaryCount: 1,
          records: records.filter(r => r.run_id === id),
          lastActivity: dirMtimes.has(dir) ? dirMtimes.get(dir) : undefined,
          bumped: bumpedDirs ? bumpedDirs.has(dir) : false,
        }));
      }
    }
  }
  // Run dirs with no telemetry files yet (empty or pre-first-record) become
  // zero-record runs, so a just-started run is visible on load (lvp-01).
  for (const [dir, ms] of dirMtimes) {
    if (groups.has(dir)) continue;
    const { dirName, date, project } = parseRunDir(dir);
    runs.push(buildRun({
      dir, runId: dirName, date, project,
      summary: null, summaryCount: 0, records: [], lastActivity: ms,
      bumped: bumpedDirs ? bumpedDirs.has(dir) : false,
    }));
  }
  return { runs, skippedLines };
}

/* ---------------- test_run provenance (ADR-051) ---------------- */

// PROVENANCE-HELPERS-START — extracted verbatim and run under node by
// tests/panel/test_panel_test_run_aggregates.py. Keep this block free of JSX
// and of anything the browser-only scope provides.
//
// A test_run record states where it came from: "wire" (observed — the command
// AET saw the agent run, with real timestamps and exit code, and never test
// counts) or "verdict" (claimed — the QA agent's self-report, carrying the only
// test counts in the archive). Records written before ADR-051 carry no source;
// they are unknown and belong to neither population. Provenance is never
// inferred from which fields happen to be set: that is right on today's data by
// coincidence and rots the moment an emitter's field set changes.
function testRunProvenance(rec) {
  const source = rec && rec.source;
  if (source === "wire") return "observed";
  if (source === "verdict") return "claimed";
  return "unknown";
}

// Timing and pass rate are measurements, so they read observed records only.
// Nothing observed means no figure — a null, not a zero (ADR-031).
function observedTestStats(tests) {
  const observed = (tests || []).filter(t => testRunProvenance(t) === "observed");
  const timed = observed.filter(t => t.duration_seconds != null);
  const decided = observed.filter(t => t.result === "success" || t.result === "failure");
  const passed = decided.filter(t => t.result === "success").length;
  const totalSeconds = timed.reduce((a, t) => a + t.duration_seconds, 0);
  return {
    runs: observed.length,
    decided: decided.length,
    passed,
    passRate: decided.length ? passed / decided.length : null,
    totalSeconds: timed.length ? totalSeconds : null,
    meanSeconds: timed.length ? totalSeconds / timed.length : null,
  };
}

// Test counts exist only on claimed records, so the count aggregate declares
// itself over them rather than relying on observed records contributing 0.
function claimedTestCounts(tests) {
  return (tests || [])
    .filter(t => testRunProvenance(t) === "claimed")
    .reduce(
      (a, t) => ({
        total: a.total + (t.tests_total || 0),
        passed: a.passed + (t.tests_passed || 0),
        failed: a.failed + (t.tests_failed || 0),
      }),
      { total: 0, passed: 0, failed: 0 }
    );
}
// PROVENANCE-HELPERS-END

/* ---------------- usage totals ---------------- */

// USAGE-HELPERS-START — extracted verbatim and run under node by
// tests/panel/test_panel_usage_totals.py. Keep this block free of JSX and of
// anything the browser-only scope provides.
//
// Cost and token figures are optional on every record that carries them. An
// agent CLI that printed no usage line leaves them null, and the archive keeps
// the null instead of writing a zero. A total therefore adds only the records
// that hold a number, and reports how many did not, so a partial total is
// never read as a complete one. Nothing measured means no figure — a null, not
// a zero (ADR-031).
function sumUsage(records, field) {
  const list = records || [];
  let total = 0;
  let counted = 0;
  for (const rec of list) {
    const value = rec ? rec[field] : null;
    if (typeof value === "number" && isFinite(value)) {
      total += value;
      counted++;
    }
  }
  return { total: counted ? total : null, counted, missing: list.length - counted };
}
// USAGE-HELPERS-END

function fmtPassRate(rate) {
  return rate == null ? "—" : `${Math.round(rate * 100)}%`;
}

// A complete total needs no caption. A partial one names its coverage.
function fmtUsageSub(usage, noun) {
  if (!usage || !usage.missing) return null;
  return `${usage.counted} of ${usage.counted + usage.missing} ${noun} measured`;
}

function buildRun(r) {
  const stages = r.records.filter(x => x.type === "stage");
  const tests = r.records.filter(x => x.type === "test_run");
  const issues = r.records.filter(x => x.type === "environment_issue");
  const learnings = r.records.filter(x => x.type === "learning_candidate");
  const tasks = [...new Set(r.records.map(x => x.task_id).filter(Boolean))];
  const starts = r.records.map(x => x.start_time || x.timestamp).filter(Boolean).sort();
  const ends = r.records.map(x => x.end_time || x.timestamp).filter(Boolean).sort();
  const start = (r.summary && r.summary.start_time) || starts[0] || null;
  const end = (r.summary && r.summary.end_time) || ends[ends.length - 1] || null;
  // Activity timestamp (ms): the dir's recursive mtime from the API when
  // present; folder-picker fallback is the latest record end time, then the
  // summary end time. Drives live/incomplete status and the Runs sort.
  const lastActivity = r.lastActivity != null
    ? r.lastActivity
    : ends.length
      ? Date.parse(ends[ends.length - 1]) || null
      : end
        ? Date.parse(end) || null
        : null;
  const duration = r.summary && r.summary.wall_clock_seconds != null
    ? r.summary.wall_clock_seconds
    : stages.reduce((a, s) => a + (s.duration_seconds || 0), 0);
  // Provenance-split test aggregates (ADR-051): counts from claimed records,
  // timing and pass rate from observed ones. Never blended.
  const testsAgg = claimedTestCounts(tests);
  const testsObserved = observedTestStats(tests);
  // Run-level token/cost: prefer the summary aggregates (orchestrator-written);
  // fall back to summing stage records for summaries written before uct-01.
  const stageTokens = stages.filter(s => s.token_count != null);
  const stageCost = stages.filter(s => s.cost_estimate != null);
  const tokens = r.summary && r.summary.total_tokens != null
    ? r.summary.total_tokens
    : (stageTokens.length ? stageTokens.reduce((a, s) => a + s.token_count, 0) : null);
  const cost = r.summary && r.summary.total_cost_usd != null
    ? r.summary.total_cost_usd
    : (stageCost.length ? stageCost.reduce((a, s) => a + s.cost_estimate, 0) : null);
  // No-summary status: poll-diff liveness (lvp-02) wins over the freshness
  // window — a dir whose mtime advanced since the previous poll is live
  // regardless of age; otherwise fall back to mtime freshness (lvp-01).
  const status = r.summary
    ? (r.summary.outcome || (r.summary.tasks_failed > 0 ? "failure" : "success"))
    : (r.bumped ? "live" : liveStatus(lastActivity));
  return { ...r, stages, tests, issues, learnings, tasks, start, end, duration, testsAgg, testsObserved, tokens, cost, lastActivity, status };
}

/* ---------------- plan model ---------------- */

// Workflow spine from aet-work/workflows/software.json; stage/stages fields on
// success records are intersected with it to compute plan progress.
const SPINE = ["plan-approved", "implemented", "qa-complete", "reviewed", "secure", "synced"];

function normalizePlanFile(p) {
  // Raw values look like {REPO_ROOT}/.worktrees/<task>/docs/plans/<plan>.md;
  // slice from docs/plans/ so the same plan run from main vs a worktree is one
  // plan. Fall back to the basename when there is no docs/plans/ segment.
  if (!p) return null;
  const i = p.indexOf("docs/plans/");
  if (i >= 0) return p.slice(i);
  return p.split("/").pop() || null;
}
function planDisplayName(norm) {
  if (!norm) return "—";
  return norm.split("/").pop().replace(/\.md$/, "");
}
function worktreeOf(rawPlanFile) {
  const m = rawPlanFile && rawPlanFile.match(/\.worktrees\/([^/]+)\//);
  return m ? m[1] : "main";
}

function spineStatusOf(sessions) {
  // Per spine state: latest record naming it wins — failure -> failed, else
  // done; states never named stay pending (honest: telemetry can't see skips).
  const sorted = [...sessions].sort((a, b) =>
    (a.start_time || a.timestamp || "").localeCompare(b.start_time || b.timestamp || ""));
  const status = {};
  for (const rec of sorted) {
    for (const s of [rec.stage, ...(rec.stages || [])]) {
      if (SPINE.includes(s)) status[s] = rec.result === "failure" ? "failed" : "done";
    }
  }
  return status;
}

function buildPlans(runs) {
  // Pass 1: global task -> plan map from every record carrying both fields.
  // First mapping wins; conflicts are counted in meta.
  const taskPlanMap = new Map();
  let taskPlanConflicts = 0;
  for (const r of runs) {
    for (const rec of r.records) {
      const norm = normalizePlanFile(rec.plan_file);
      if (!rec.task_id || !norm) continue;
      if (taskPlanMap.has(rec.task_id)) {
        if (taskPlanMap.get(rec.task_id) !== norm) taskPlanConflicts++;
      } else {
        taskPlanMap.set(rec.task_id, norm);
      }
    }
  }
  // Pass 2: group records by (project, normalized plan). run_summary-only runs
  // attribute to plans via task_ids through the map.
  const plans = new Map();
  for (const r of runs) {
    const byPlan = new Map();
    for (const rec of r.records) {
      const norm = normalizePlanFile(rec.plan_file);
      if (!norm) continue;
      if (!byPlan.has(norm)) byPlan.set(norm, []);
      byPlan.get(norm).push(rec);
    }
    if (byPlan.size === 0 && r.summary && Array.isArray(r.summary.task_ids)) {
      for (const tid of r.summary.task_ids) {
        const norm = taskPlanMap.get(tid);
        if (norm && !byPlan.has(norm)) byPlan.set(norm, []);
      }
    }
    for (const [norm, recs] of byPlan) {
      const key = r.project + "::" + norm;
      let p = plans.get(key);
      if (!p) {
        p = {
          key, norm, name: planDisplayName(norm), project: r.project,
          runs: [], sessions: [], tests: [], issues: [], learnings: [],
          taskIds: new Set(), spine: new Set(), lastActivity: null, status: "success",
          live: false,
        };
        plans.set(key, p);
      }
      if (!p.runs.includes(r.dir)) p.runs.push(r.dir);
      if (r.status === "live") p.live = true;
      const timed = [];
      for (const rec of recs) {
        if (rec.task_id) p.taskIds.add(rec.task_id);
        const t = rec.end_time || rec.timestamp;
        if (t) timed.push({ t, result: rec.result });
        if (rec.type === "stage") {
          p.sessions.push({ ...rec, runId: r.runId, runDir: r.dir, worktree: worktreeOf(rec.plan_file) });
          if (rec.result === "success") {
            for (const s of [rec.stage, ...(rec.stages || [])]) {
              if (SPINE.includes(s)) p.spine.add(s);
            }
          }
        } else if (rec.type === "test_run") {
          p.tests.push({ ...rec, runId: r.runId, runDir: r.dir, worktree: worktreeOf(rec.plan_file) });
        } else if (rec.type === "environment_issue") {
          p.issues.push(rec);
        } else if (rec.type === "learning_candidate") {
          p.learnings.push(rec);
        }
      }
      timed.sort((a, b) => a.t.localeCompare(b.t));
      const last = timed[timed.length - 1];
      if (last && (!p.lastActivity || last.t > p.lastActivity)) {
        p.lastActivity = last.t;
        p.status = last.result === "failure" ? "failure" : "success";
      }
    }
  }
  const out = [...plans.values()].map(p => ({
    ...p, progress: p.spine.size, spineStatus: spineStatusOf(p.sessions), taskIds: [...p.taskIds],
    testsAgg: claimedTestCounts(p.tests), testsObserved: observedTestStats(p.tests),
  }));
  out.sort((a, b) => (b.lastActivity || "").localeCompare(a.lastActivity || ""));
  return { plans: out, meta: { taskPlanConflicts } };
}

/* ---------------- shadcn-style components ---------------- */

function Button({ children, variant = "default", size = "default", className = "", ...props }) {
  const base = "inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50";
  const variants = {
    default: "bg-primary text-primary-foreground shadow hover:bg-primary/90",
    outline: "border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground",
    ghost: "hover:bg-accent hover:text-accent-foreground",
  };
  const sizes = { default: "h-9 px-4 py-2", sm: "h-8 rounded-md px-3 text-xs" };
  return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>{children}</button>;
}

function Card({ children, className = "", ...props }) {
  return <div className={`rounded-lg border bg-card text-card-foreground shadow-sm ${className}`} {...props}>{children}</div>;
}
function CardHeader({ children, className = "" }) {
  return <div className={`flex flex-col space-y-1.5 p-4 ${className}`}>{children}</div>;
}
function CardTitle({ children, className = "" }) {
  return <h3 className={`text-sm font-medium text-muted-foreground ${className}`}>{children}</h3>;
}
function CardContent({ children, className = "" }) {
  return <div className={`p-4 pt-0 ${className}`}>{children}</div>;
}

function Badge({ children, variant = "default", className = "", ...props }) {
  const base = "inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors";
  const variants = {
    default: "border-transparent bg-primary text-primary-foreground",
    secondary: "border-transparent bg-secondary text-secondary-foreground",
    destructive: "border-transparent bg-destructive text-destructive-foreground",
    success: "border-transparent bg-emerald-100 text-emerald-800",
    warning: "border-transparent bg-amber-100 text-amber-800",
    quarantined: "border-transparent bg-rose-100 text-rose-800",
    outline: "text-foreground",
  };
  return <span className={`${base} ${variants[variant]} ${className}`} {...props}>{children}</span>;
}

function TaskStateBadge({ state }) {
  // Render a task lifecycle state with a stable color (nsr-02).
  const variants = {
    planned: "outline",
    ready: "success",
    blocked: "warning",
    in_progress: "secondary",
    awaiting_merge: "secondary",
    merged: "success",
    abandoned: "destructive",
    failed: "destructive",
    quarantined: "quarantined",
  };
  return <Badge variant={variants[state] || "outline"}>{state || "—"}</Badge>;
}

function Select({ children, className = "", ...props }) {
  return (
    <select className={`flex h-9 rounded-md border border-input bg-background px-3 py-1 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring ${className}`} {...props}>
      {children}
    </select>
  );
}

function Input({ className = "", ...props }) {
  return (
    <input className={`flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring ${className}`} {...props} />
  );
}

function Tabs({ value, onChange, options }) {
  return (
    <div className="inline-flex h-9 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground">
      {options.map(o => (
        <button
          key={o.value}
          onClick={() => onChange(o.value)}
          className={`inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring ${value === o.value ? "bg-primary text-primary-foreground shadow" : "hover:text-foreground"}`}
        >
          {o.label}
        </button>
      ))}
    </div>
  );
}

function Table({ children, className = "", ...props }) {
  return (
    <div className="w-full overflow-auto">
      <table className={`w-full caption-bottom text-sm ${className}`} {...props}>{children}</table>
    </div>
  );
}
function Th({ children, className = "", ...props }) {
  return <th className={`h-9 px-3 text-left align-middle font-medium text-muted-foreground whitespace-nowrap ${className}`} {...props}>{children}</th>;
}
function Td({ children, className = "", ...props }) {
  return <td className={`px-3 py-2 align-middle ${className}`} {...props}>{children}</td>;
}

function ResultBadge({ result }) {
  if (result === "live") {
    return <Badge variant="success" className="gap-1.5"><span className="live-dot" />live</Badge>;
  }
  if (result === "incomplete") {
    return <Badge variant="warning">incomplete</Badge>;
  }
  return result === "failure"
    ? <Badge variant="destructive">failure</Badge>
    : <Badge variant="success">success</Badge>;
}

// Where a test_run record is rendered on its own, it says which population it
// belongs to (ADR-051): "observed" is a measurement, "claimed" is the QA
// agent's self-report, "unknown" is a record written before provenance existed.
const PROVENANCE_TITLES = {
  observed: "Measured from the session log — counted in timing and pass-rate figures",
  claimed: "Reported by the QA verdict — counted in test counts only",
  unknown: "Written before ADR-051 — excluded from every provenance-filtered figure",
};

function ProvenanceBadge({ provenance }) {
  const variant = provenance === "observed" ? "outline" : "warning";
  return <Badge variant={variant} title={PROVENANCE_TITLES[provenance]}>{provenance}</Badge>;
}

      <CardContent>
        <div className="text-2xl font-bold">{value}</div>
        {sub && <p className="text-xs text-muted-foreground mt-0.5">{sub}</p>}

  );
}

function PlansTable({ plans, selectedKey, onSelect }) {

function PlanDetail({ plan, runs, onOpenRun }) {
  if (!plan) {
    return (
      <Card className="h-full flex items-center justify-center min-h-[200px]">
        <p className="text-sm text-muted-foreground">Select a plan to inspect its summary.</p>
      </Card>
    );
  }
  // One chronological stream of every stage session and test run across all
  // of the plan's runs; retries show up as repeated rows.
  const timeline = [
    ...plan.sessions.map(r => ({ ...r, kind: "stage" })),
    ...plan.tests.map(r => ({ ...r, kind: "test" })),
  ].sort((a, b) => (a.start_time || a.timestamp || "").localeCompare(b.start_time || b.timestamp || ""));
  return (
    <Card className="h-full overflow-auto" data-testid="plan-detail">
      <CardHeader>
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div className="min-w-0">
            <div className="font-semibold break-all">{plan.name}</div>
            <div className="text-xs text-muted-foreground mt-1">
              {plan.project} · last activity {fmtTime(plan.lastActivity)}
            </div>
          </div>
          <ResultBadge result={plan.status} />
        </div>
      </CardHeader>
      <CardContent>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
          <Stat label="Contributing runs" value={plan.runs.length} testid="plan-detail-runs" />
          <Stat label="Stage sessions" value={plan.sessions.length} />
          <Stat label="Tests (claimed)" value={plan.testsAgg.total ? `${plan.testsAgg.passed}/${plan.testsAgg.total} passed` : "—"} testid="plan-detail-tests-claimed" />
          <Stat label="Observed pass rate" value={fmtPassRate(plan.testsObserved.passRate)} testid="plan-detail-observed-pass-rate" />
          <Stat label="Progress" value={`${plan.progress}/6`} />
        </div>

        <SectionTitle>Pipeline spine</SectionTitle>
        <div className="flex items-center gap-1 flex-wrap">
          {SPINE.map((s, i) => {
            const st = (plan.spineStatus && plan.spineStatus[s]) || "pending";
            const variant = st === "done" ? "success" : st === "failed" ? "destructive" : "outline";
            return (
              <React.Fragment key={s}>
                {i > 0 && <span className="text-muted-foreground text-xs">→</span>}
                <Badge variant={variant} data-testid={`spine-state-${s}`} data-state={st}>{s}</Badge>
              </React.Fragment>
            );
          })}
        </div>

        <SectionTitle count={timeline.length}>Timeline</SectionTitle>
        <Table>
          <thead><tr className="border-b">
            <Th>Time</Th><Th>Run</Th><Th>Worktree</Th><Th>Kind</Th><Th>Provenance</Th><Th>Stage</Th><Th>Duration</Th><Th>Tokens</Th><Th>Cost</Th><Th>Result</Th>
          </tr></thead>
          <tbody>
            {timeline.map((r, i) => (
              <tr
                key={i}
                data-testid="timeline-row"
                data-kind={r.kind}
                data-run={r.runId}
                data-time={r.start_time || r.timestamp || ""}
                data-result={r.result}
                className="border-b hover:bg-muted/50"
              >
                <Td className="whitespace-nowrap text-muted-foreground text-xs">{fmtTime(r.start_time || r.timestamp)}</Td>
                <Td className="font-mono text-xs" title={r.runId}>{shortId(r.runId)}</Td>
                <Td data-testid="timeline-worktree" className="whitespace-nowrap">{r.worktree || "—"}</Td>
                <Td><Badge variant="outline">{r.kind}</Badge></Td>
                <Td data-testid="timeline-provenance" className="whitespace-nowrap">
                  {r.kind === "test" ? <ProvenanceBadge provenance={testRunProvenance(r)} /> : "—"}
                </Td>
                <Td data-testid="timeline-stage" className="whitespace-nowrap">{r.stage || "—"}</Td>
                <Td data-testid="timeline-duration" className="whitespace-nowrap">{fmtDuration(r.duration_seconds)}</Td>
                <Td className="whitespace-nowrap text-muted-foreground">{r.kind === "stage" ? fmtTokens(r.token_count) : "—"}</Td>
                <Td className="whitespace-nowrap text-muted-foreground">{r.kind === "stage" ? fmtCost(r.cost_estimate) : "—"}</Td>
                <Td><ResultBadge result={r.result} /></Td>
              </tr>
            ))}
            {timeline.length === 0 && (
              <tr><td colSpan="10" data-testid="timeline-empty" className="px-3 py-8 text-center text-muted-foreground">No stage sessions or test runs recorded for this plan</td></tr>
            )}
          </tbody>
        </Table>

        {plan.issues.length > 0 && (
          <>
            <SectionTitle count={plan.issues.length}>Environment issues</SectionTitle>
            <IssuesTable issues={plan.issues} />
          </>
        )}

        {plan.learnings.length > 0 && (
          <>
            <SectionTitle count={plan.learnings.length}>Learning candidates</SectionTitle>
            <LearningsTable learnings={plan.learnings} />
          </>
        )}

        <SectionTitle count={plan.runs.length}>Contributing runs</SectionTitle>
        <div className="flex flex-wrap gap-1.5">
          {plan.runs.map(dir => {
            const run = runs.find(r => r.dir === dir);
            return (
              <button
                key={dir}
                data-testid="run-chip"
                data-run-dir={dir}
                onClick={() => onOpenRun(dir)}
                title={dir}
                className="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-mono transition-colors hover:bg-accent"
              >
                {shortId(run ? run.runId : dir)}
              </button>
            );
          })}
        </div>

        <div className="text-xs text-muted-foreground mt-5">
          {plan.issues.length} environment issue(s) · {plan.learnings.length} learning candidate(s)
          {" · tasks: "}{plan.taskIds.join(", ") || "—"}
        </div>
      </CardContent>
    </Card>
  );
}

function SectionTitle({ children, count }) {
  return (
    <div className="flex items-center gap-2 mt-5 mb-2">
      <h3 className="text-sm font-semibold">{children}</h3>
      {count != null && <Badge variant="secondary">{count}</Badge>}

  );

function IssuesTable({ issues }) {

            <Td><Badge variant="outline">{is.issue_type || "—"}</Badge></Td>
            <Td className="font-mono text-xs">{is.dependency || "—"}</Td>

function LearningsTable({ learnings }) {

    <Table data-testid="learnings-table">
      <thead><tr className="border-b">
        <Th>Stage</Th><Th>Pattern</Th><Th>Confidence</Th><Th>Description</Th>
      </tr></thead>
      <tbody>
        {learnings.map((l, i) => (

            <Td><Badge variant="outline">{l.pattern_type || "—"}</Badge></Td>
            <Td>{l.confidence != null ? l.confidence.toFixed(2) : "—"}</Td>
            <Td className="text-xs">{l.description || "—"}</Td>
          </tr>

      </tbody>
    </Table>

}

function RunDetail({ run }) {
  if (!run) {
    return (
      <Card className="h-full flex items-center justify-center min-h-[200px]">
        <p className="text-sm text-muted-foreground">Select a run to inspect its records.</p>

    <Card className="h-full overflow-auto" data-testid="run-detail">

            <div className="text-xs text-muted-foreground mt-1">

          </div>
          <ResultBadge result={run.status} />
        </div>
      </CardHeader>
      <CardContent>

          <div data-testid="run-progress-banner" className="rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-900 mb-3">

              <thead><tr className="border-b">
                <Th>Task</Th><Th>Stage</Th><Th>Agent</Th><Th>Isolation</Th><Th>Duration</Th><Th>Tokens</Th><Th>Cost</Th><Th>Exit</Th><Th>Files</Th><Th>Result</Th>
              </tr></thead>
              <tbody>
                {run.stages.map((st, i) => (
                  <tr key={i} className="border-b hover:bg-muted/50">

                    <Td><Badge variant="outline">{st.isolation_level || "—"}</Badge></Td>
                    <Td className="whitespace-nowrap">{fmtDuration(st.duration_seconds)}</Td>
                    <Td data-testid="stage-tokens" className="whitespace-nowrap text-muted-foreground">{fmtTokens(st.token_count)}</Td>
                    <Td data-testid="stage-cost" className="whitespace-nowrap text-muted-foreground">{fmtCost(st.cost_estimate)}</Td>

            <Table>
              <thead><tr className="border-b">
                <Th>Task</Th><Th>Stage</Th><Th>Provenance</Th><Th>Scope</Th><Th>Command</Th><Th>Passed</Th><Th>Failed</Th><Th>Result</Th>

                    <Td className={t.tests_failed ? "text-destructive font-medium" : ""}>{t.tests_failed ?? "—"}</Td>
                    <Td><ResultBadge result={t.result} /></Td>

            </Table>

        {run.issues.length > 0 && (
          <>
            <SectionTitle count={run.issues.length}>Environment issues</SectionTitle>
            <IssuesTable issues={run.issues} />
          </>
        )}

        {run.learnings.length > 0 && (
          <>
            <SectionTitle count={run.learnings.length}>Learning candidates</SectionTitle>
            <LearningsTable learnings={run.learnings} />

        )}

        <div className="text-xs text-muted-foreground mt-5">
          {run.records.length} record(s){s && s.parallel_conflicts_detected ? ` · ${s.parallel_conflicts_detected} parallel conflict(s) detected` : ""}
          {s && s.concurrency_cap != null ? ` · concurrency cap ${s.concurrency_cap}` : ""}
        </div>
      </CardContent>
    </Card>
  );

function Stat({ label, value, testid }) {
  return (
    <div className="rounded-md border p-2.5">
      <div className="text-[11px] text-muted-foreground">{label}</div>
      <div className="text-sm font-semibold mt-0.5" data-testid={testid}>{value}</div>
    </div>

}

          This page was opened directly, so the browser cannot reach <code className="font-mono text-xs bg-muted px-1 py-0.5 rounded">~/.aet/telemetry</code> on its own.

      </CardHeader>
      <CardContent className="space-y-3">
        <div className="rounded-md border bg-muted/40 p-3 font-mono text-xs">aet panel</div>
        <div className="flex items-center gap-3">
          <div className="flex-1 border-t" />
          <span className="text-xs text-muted-foreground">or</span>
          <div className="flex-1 border-t" />
        </div>
        <Button variant="outline" onClick={onPick} className="w-full">Choose telemetry folder manually</Button>
      </CardContent>
    </Card>
  );
}

/* ---------------- app ---------------- */

function App() {
  const [runs, setRuns] = useState([]);
  const [meta, setMeta] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [lens, setLens] = useState("plans");
  const [selectedPlanKey, setSelectedPlanKey] = useState(null);
  const [loading, setLoading] = useState(true);
  const [progress, setProgress] = useState(null);
  const [source, setSource] = useState(null); // "archive" | "picker"
  const [filterFolder, setFilterFolder] = useState("all");
  const [filterProject, setFilterProject] = useState("all");
  const [filterStatus, setFilterStatus] = useState("all");
  const [search, setSearch] = useState("");
  const inputRef = useRef(null);
  // Last-seen /api/list dir snapshot (rel -> mtime seconds) for the
  // incremental poll diff; runsRef lets the poll loop read current runs
  // without re-subscribing on every merge.
  const snapshotRef = useRef(new Map());
  const runsRef = useRef(runs);
  runsRef.current = runs;

  function sortRuns(parsed) {
    // Live runs first, then most recent archive activity (lvp-01).
    parsed.sort((a, b) => {
      const al = a.status === "live" ? 1 : 0;
      const bl = b.status === "live" ? 1 : 0;
      if (al !== bl) return bl - al;
      return (b.lastActivity || 0) - (a.lastActivity || 0);
    });
    return parsed;
  }

  function applyLoaded({ runs: parsed, skippedLines, filesSeen, root, dirs }, src) {
    setRuns(sortRuns(parsed));
    setMeta({ filesSeen, skippedLines, root: root || null });
    setSource(src);
    setSelectedId(parsed[0] ? parsed[0].dir : null);
    snapshotRef.current = new Map((dirs || []).map(d => [d.rel, d.mtime]));
    setFilterFolder("all");
    setFilterProject("all");
    setFilterStatus("all");
    setSearch("");
  }

  async function loadArchive() {
    setLoading(true);
    setProgress(null);
    try {
      applyLoaded(await loadTelemetryFromApi((done, total) => setProgress({ done, total })), "archive");
      return true;
    } finally {
      setLoading(false);
      setProgress(null);
    }
  }

  // On mount, try the bundled server's API (serves ~/.aet/telemetry directly).
  // If unreachable (page opened as a plain file), fall back to the folder picker.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch("/api/list", { cache: "no-store" });
        if (!res.ok) throw new Error("no api");
      } catch {
        if (!cancelled) setLoading(false);
        return;
      }
      if (!cancelled) await loadArchive();
    })();
    return () => { cancelled = true; };
  }, []);

  // Incremental poll tick (lvp-02): diff the polled dirs against the last
  // snapshot by (rel, mtime); re-fetch only new/changed dirs' files, rebuild
  // those runs, and merge them into the list in place. Lens, filters, and
  // selection live in separate state, so they survive the merge untouched.
  async function pollOnce() {
    const res = await fetch("/api/list", { cache: "no-store" });
    if (!res.ok) return;
    const { files, dirs } = await res.json();
    const prev = snapshotRef.current;
    const changed = (dirs || []).filter(d => {
      const old = prev.get(d.rel);
      return old === undefined || (d.mtime != null && d.mtime > old);
    });
    snapshotRef.current = new Map((dirs || []).map(d => [d.rel, d.mtime]));
    if (!changed.length) return;
    const changedDirs = new Set(changed.map(d => d.rel));
    const pairs = [];
    for (const rel of files || []) {
      const parts = rel.split("/");
      parts.pop();
      if (changedDirs.has(parts.join("/"))) pairs.push({ rel });
    }
    const { groups } = collectGroups(pairs);
    const entries = [];
    for (const e of groups.values()) entries.push(...e);
    await readInBatches(entries, async e => {
      const r = await fetch("/api/file?p=" + encodeURIComponent(e.rel));
      if (!r.ok) throw new Error(`cannot read ${e.rel}`);
      return r.text();
    });
    const { runs: rebuilt } = buildRunsFromGroups(groups, changed, changedDirs);
    setRuns(prev => sortRuns([...prev.filter(r => !changedDirs.has(r.dir)), ...rebuilt]));
  }

  // Poll loop: 5s cadence while the tab is visible and any no-summary run has
  // activity younger than the polling window; stops once all runs settle.
  useEffect(() => {
    if (source !== "archive") return;
    let timer = null;
    let inFlight = false;
    const active = () => runsRef.current.some(r =>
      !r.summary && r.lastActivity != null &&
      Date.now() - r.lastActivity < POLL_ACTIVITY_MINUTES * 60 * 1000);
    const tick = async () => {
      if (inFlight) return;
      inFlight = true;
      try { await pollOnce(); } catch { /* transient localhost failure: keep polling */ }
      inFlight = false;
    };
    const schedule = () => {
      clearTimeout(timer);
      timer = null;
      if (document.visibilityState === "visible" && active()) {
        timer = setTimeout(async () => { await tick(); schedule(); }, POLL_INTERVAL_MS);
      }
    };
    // Pause on hidden (a laptop lid closed overnight never wakes the panel);
    // resume with an immediate tick so returning to the tab is instant.
    const onVisibility = () => {
      if (document.visibilityState === "visible") {
        if (active()) tick().then(schedule);
      } else {
        clearTimeout(timer);
        timer = null;
      }
    };
    document.addEventListener("visibilitychange", onVisibility);
    schedule();
    return () => {
      clearTimeout(timer);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, [source]);

  async function handleFiles(e) {
    const files = e.target.files;
    if (!files || !files.length) return;
    setLoading(true);
    try {
      applyLoaded(await parseTelemetryFiles(files), "picker");
    } finally {
      setLoading(false);
      e.target.value = "";
    }
  }

  const folders = useMemo(() => [...new Set(runs.map(r => r.project.split("/")[0]))].sort(), [runs]);
  const projects = useMemo(() => [...new Set(runs
    .filter(r => filterFolder === "all" || r.project === filterFolder || r.project.startsWith(filterFolder + "/"))
    .map(r => r.project))].sort(), [runs, filterFolder]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return runs.filter(r => {
      if (filterFolder !== "all" && !(r.project === filterFolder || r.project.startsWith(filterFolder + "/"))) return false;
      if (filterProject !== "all" && r.project !== filterProject) return false;
      if (filterStatus !== "all" && r.status !== filterStatus) return false;
      if (q) {
        const hay = [r.project, r.runId, r.date, ...r.tasks, ...r.records.map(x => basename(x.plan_file))].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [runs, filterFolder, filterProject, filterStatus, search]);

  const stats = useMemo(() => {
    const stageCount = filtered.reduce((a, r) => a + r.stages.length, 0);
    const ok = filtered.filter(r => r.status === "success").length;
    const totalTime = filtered.reduce((a, r) => a + (r.duration || 0), 0);
    // A run resolves its own cost and tokens in buildRun, preferring the
    // run_summary figure over the sum of its stages, so summing per run here
    // never double-counts a stage.
    return {
      stageCount, ok, totalTime,
      cost: sumUsage(filtered, "cost"),
      tokens: sumUsage(filtered, "tokens"),
    };
  }, [filtered]);

  const planData = useMemo(() => buildPlans(runs), [runs]);

  const filteredPlans = useMemo(() => {
    const q = search.trim().toLowerCase();
    return planData.plans.filter(p => {
      if (filterFolder !== "all" && !(p.project === filterFolder || p.project.startsWith(filterFolder + "/"))) return false;
      if (filterProject !== "all" && p.project !== filterProject) return false;
      // Plans carry success/failure only; "live" matches plans with a live run.
      if (filterStatus === "live" && !p.live) return false;
      if (filterStatus !== "all" && filterStatus !== "live" && p.status !== filterStatus) return false;
      if (q) {
        const hay = [p.name, p.norm, p.project, ...p.taskIds].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [planData, filterFolder, filterProject, filterStatus, search]);

  const planStats = useMemo(() => {
    // A plan holds stage sessions, not run summaries, so its usage totals come
    // from the sessions. A plan attributed only through run_summary task_ids
    // has no sessions and contributes nothing to either total.
    const sessions = filteredPlans.flatMap(p => p.sessions);
    const stageCount = sessions.length;
    const ok = filteredPlans.filter(p => p.status === "success").length;
    const totalTime = sessions.reduce((a, x) => a + (x.duration_seconds || 0), 0);
    return {
      stageCount, ok, totalTime,
      cost: sumUsage(sessions, "cost_estimate"),
      tokens: sumUsage(sessions, "token_count"),
    };
  }, [filteredPlans]);

  const selected = runs.find(r => r.dir === selectedId) || null;
  const selectedPlan = planData.plans.find(p => p.key === selectedPlanKey) || filteredPlans[0] || null;
  const archiveEmpty = source === "archive" && !loading && runs.length === 0;

  return (
    <div className="max-w-[1400px] mx-auto p-4 md:p-6">
      <header className="flex items-center justify-between gap-4 flex-wrap mb-5">
        <div>
          <h1 className="text-xl font-bold tracking-tight">AET Telemetry Panel</h1>
          <p className="text-sm text-muted-foreground">
            Local execution log viewer for <code className="font-mono text-xs">aet-work</code> runs
            {meta && meta.root && <span> · <code className="font-mono text-xs">{meta.root}</code></span>}
          </p>
        </div>
        <div className="flex items-center gap-2">
          {runs.length > 0 && (
            <Tabs value={lens} onChange={setLens} options={[{ value: "plans", label: "Plans" }, { value: "runs", label: "Runs" }]} />
          )}
          {meta && (
            <span className="text-xs text-muted-foreground">
              {meta.filesSeen} file(s){meta.skippedLines ? ` · ${meta.skippedLines} malformed line(s) skipped` : ""}
            </span>
          )}
          {source === "archive" && (
            <Button variant="outline" size="sm" onClick={loadArchive} disabled={loading}>
              {loading ? "Loading…" : "Refresh archive"}
            </Button>
          )}
          <Button variant={source === "archive" ? "ghost" : runs.length ? "outline" : "default"} size="sm" onClick={() => inputRef.current.click()} disabled={loading}>
            {runs.length ? "Load another folder" : "Open telemetry folder"}
          </Button>
          <input ref={inputRef} type="file" webkitdirectory="" directory="" multiple className="hidden" onChange={handleFiles} />
        </div>
      </header>

      {loading && runs.length === 0 && (
        <p className="text-sm text-muted-foreground mt-16 text-center">
          {progress ? `Reading telemetry files… ${progress.done}/${progress.total}` : "Loading telemetry archive…"}
        </p>
      )}
      {!loading && archiveEmpty && <EmptyState mode="empty" />}
      {!loading && !runs.length && !archiveEmpty && <EmptyState mode="connect" onPick={() => inputRef.current.click()} />}

      {runs.length > 0 && (
        <>
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">
            {lens === "plans" ? (
              <>
                <StatCard label="Plans" value={filteredPlans.length} sub={`of ${planData.plans.length} total`} />
                <StatCard label="Stage sessions" value={planStats.stageCount} />
                <StatCard label="Success rate" value={filteredPlans.length ? `${Math.round((planStats.ok / filteredPlans.length) * 100)}%` : "—"} sub={`${planStats.ok} ok / ${filteredPlans.length - planStats.ok} failed`} />
                <StatCard label="Total time" value={fmtDuration(planStats.totalTime)} />
                <StatCard label="Total cost" value={fmtCost(planStats.cost.total)} sub={fmtUsageSub(planStats.cost, "sessions")} />
                <StatCard label="Total tokens" value={fmtTokens(planStats.tokens.total)} sub={fmtUsageSub(planStats.tokens, "sessions")} />
              </>
            ) : (
              <>
                <StatCard label="Runs" value={filtered.length} sub={`of ${runs.length} total`} />
                <StatCard label="Stage sessions" value={stats.stageCount} />
                <StatCard label="Success rate" value={filtered.length ? `${Math.round((stats.ok / filtered.length) * 100)}%` : "—"} sub={`${stats.ok} ok / ${filtered.length - stats.ok} failed`} />
                <StatCard label="Total time" value={fmtDuration(stats.totalTime)} />
                <StatCard label="Total cost" value={fmtCost(stats.cost.total)} sub={fmtUsageSub(stats.cost, "runs")} />
                <StatCard label="Total tokens" value={fmtTokens(stats.tokens.total)} sub={fmtUsageSub(stats.tokens, "runs")} />
              </>
            )}
          </div>

          <div className="flex items-center gap-2 flex-wrap mb-4">
            <Input placeholder="Search task, plan, run id…" value={search} onChange={e => setSearch(e.target.value)} className="max-w-xs" />
            <Select value={filterFolder} onChange={e => { setFilterFolder(e.target.value); setFilterProject("all"); }}>
              <option value="all">All folders</option>
              {folders.map(f => <option key={f} value={f}>{f}</option>)}
            </Select>
            <Select value={filterProject} onChange={e => setFilterProject(e.target.value)}>
              <option value="all">All projects</option>
              {projects.map(p => <option key={p} value={p}>{p}</option>)}
            </Select>
            <Select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="all">All statuses</option>
              <option value="success">Success</option>
              <option value="failure">Failure</option>
              <option value="live">Live</option>
              <option value="incomplete">Incomplete</option>
            </Select>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Card className="max-h-[68vh] overflow-auto">
              {lens === "plans"
                ? <PlansTable plans={filteredPlans} selectedKey={selectedPlan ? selectedPlan.key : null} onSelect={setSelectedPlanKey} />
                : <RunsTable runs={filtered} selectedId={selectedId} onSelect={setSelectedId} />}
            </Card>
            <div className="max-h-[68vh]">
              {lens === "plans"
                ? <PlanDetail plan={selectedPlan} runs={runs} onOpenRun={dir => { setSelectedId(dir); setLens("runs"); }} />
                : <RunDetail run={selected} />}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
