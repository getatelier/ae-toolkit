# Documentation governance rules for `aet docs lint`.
# Rules are evaluated in order; a missing target file fails closed.
rules:
  # tests/skills/test_aet_qa.py
  - type: must_contain
    target: skills/aet-qa/SKILL.md
    value: "Run the full test suite unconditionally"
    reason: "SKILL.md must state that QA owns the full suite unconditionally"

  - type: must_contain
    target: skills/aet-qa/SKILL.md
    value: "do not reuse a cached result from `aet-implement`"
    reason: "SKILL.md must forbid reusing implement validation results"

  - type: must_contain
    target: skills/aet-qa/SKILL.md
    value: "Gap analysis"
    reason: "SKILL.md must include gap analysis against implement targeted tests"

  - type: must_contain
    target: skills/aet-qa/SKILL.md
    value: "Stage-failure triage"
    reason: "SKILL.md should include a stage-failure triage checklist"

  - type: must_contain
    target: skills/aet-qa/SKILL.md
    value:
      - "command"
      - "output"
      - "Files touched"
      - "Last successful stage"
      - "environment variables"
      - "reproduces outside"
    reason: "Triage checklist should mention the required evidence fields"

  - type: must_contain
    target: skills/aet-qa/SKILL.md
    value: "QA report"
    reason: "Triage evidence should be appended to the QA report"

  # tests/skills/test_aet_review.py
  - type: must_contain
    target: skills/aet-review/SKILL.md
    value: "git diff <base>..HEAD"
    reason: "SKILL.md should scope the review diff to the PR base"

  - type: must_contain
    target: skills/aet-review/SKILL.md
    value:
      - ".gitignore"
      - "AGENTS.md"
      - "docs/CONVENTIONS.md"
    reason: "Noise filter should mention the required noise files"

  - type: must_contain
    target: skills/aet-review/SKILL.md
    value: "explicitly modifies them"
    reason: "Noise files should be in-scope only when explicitly modified"

  # tests/ship/test_merge_governance.py
  - type: path_exists
    target: docs/adr/029-autonomous-merge-fail-closed.md
    reason: "Expected ADR-029 to exist"

  - type: must_contain
    target: docs/adr/029-autonomous-merge-fail-closed.md
    value:
      - "ADR-005"
      - "extends"
      - "autonomous merge"
      - "fail-closed"
    reason: "ADR-029 must reference ADR-005, state it extends ADR-005, mention autonomous merge, and state fail-closed posture"

  - type: must_contain
    target: docs/CONVENTIONS.md
    section: "Gates That Must Still Stop in Unattended Mode"
    value:
      - "Autonomous merge"
      - "ADR-029"
    reason: "CONVENTIONS.md must list autonomous merge as a must-stop gate and cite ADR-029"

  - type: must_contain
    target: docs/CONVENTIONS.md
    section: "Author Checklist"
    value:
      - "Autonomous-merge is fail-closed"
      - "skills never instruct a PR merge"
    reason: "CONVENTIONS.md Author Checklist must enforce merge-neutral skills"

  - type: must_not_contain
    target: skills/aet-ship/SKILL.md
    value:
      - "gh pr merge"
      - "self-merge"
      - "merge the pr"
      - "merge your own pr"
    reason: "aet-ship must not instruct an agent to run gh pr merge or self-merge"

  - type: must_contain
    target: skills/aet-ship/SKILL.md
    value:
      - "aet ship close"
      - "post-merge closure"
    reason: "aet-ship judgment residue must reference the code-implemented closure command"

  # nc-03c addition to test_merge_governance.py
  - type: must_contain
    target: .agents/commands/aet-work.md
    value:
      - "merge is the human's decision"
      - "Trying to merge the PR yourself"
    reason: "The canonical aet-work command doc must state that the human decides to merge"

  # tests/test_scripts_layout.py
  - type: path_exists
    target: scripts/archive/migrate-plans-to-frontmatter.py
    reason: "Migration scripts are archived"

  - type: path_exists
    target: scripts/archive/migrate-telemetry-slugs.py
    reason: "Migration scripts are archived"

  - type: path_absent
    target: scripts/test-aet-state.py
    reason: "Misplaced pytest modules removed"

  - type: path_absent
    target: scripts/test-telemetry.py
    reason: "Misplaced pytest modules removed"

  - type: path_exists
    target: scripts/archive/README.md
    reason: "Archive README documents releases"

  - type: must_contain
    target: scripts/archive/README.md
    value:
      - "v0.7.0"
      - "v1.0.0"
      - "migrate-plans-to-frontmatter.py"
      - "migrate-telemetry-slugs.py"
    reason: "Archive README documents releases"

  # t2r-06: one subject, one live ADR
  - type: unique_live_subject
    target: docs/adr
    reason: "Each architectural subject must resolve to exactly one live ADR"

  # dcl-02: ADR corpus structural integrity and relation consistency
  - type: adr_corpus_integrity
    target: docs/adr
    severity: warning
    reason: "The ADR corpus must maintain number uniqueness, relation integrity, and subject frontmatter"

  # dcl-05: Code anchors resolve to a symbol, not a line
  - type: code_anchor_resolves
    target: docs/prds
    severity: warning
    reason: "Code anchors in PRDs must resolve to a symbol, not a line"

  # t2r-06: intake-commit rules are pinned in data
  - type: must_contain
    target: skills/aet-work/SKILL.md
    value: "No commit or push happens at intake"
    reason: "aet-work SKILL.md must state the intake durability rule"

  - type: must_contain
    target: skills/aet-work/references/queue-commands.md
    value: "No commit or push happens at intake"
    reason: "queue-commands reference must state the intake durability rule"

  - type: must_not_contain
    target: skills
    value: "commit the plan files"
    reason: "Skills must never instruct committing plan files at intake"

  # t2r-06: footer-format-string contradiction
  - type: must_not_contain
    target: skills/aet-upgrade/references/breaking-change-template.md
    value: "aet-pipeline-implement"
    reason: "Breaking-change template must reference the current next-step skill"

  # t2r-06: direct-JSON-edit contradiction
  - type: must_not_contain
    target: skills/aet-work/references/queue-commands.md
    value: "direct JSON update"
    reason: "Stale-worktree repair must go through aet state transition only"

  # owb-14 / R-18: documentation truth — no ledger refs transport
  - type: must_not_contain
    target: docs/CONVENTIONS.md
    value:
      - "Queue and ledger state travel"
      - "ledger state travel with the repo"
    reason: "CONVENTIONS.md must not claim the provenance ledger travels via git refs (R-18)"

  - type: must_not_contain
    target: docs/WORKFLOW-github.md
    value: "queue derived from ledger"
    reason: "WORKFLOW-github.md must not claim the queue is derived from the ledger (R-18)"

  - type: must_not_contain
    target: CONTEXT.md
    value:
      - "queue and ledger state travel via `refs/aet/*`"
      - "ledger lives in `refs/aet/*`"
    reason: "CONTEXT.md must not claim the provenance ledger travels via git refs (R-18)"

  - type: must_not_contain
    target: src/aet/backends/git_refs_backend.py
    value: "Replication to the forge remote is explicit"
    reason: "git_refs_backend.py must not imply all aet-state output (including the ledger) replicates via refs (R-18)"

  - type: must_not_contain
    target: src/aet/cli/sync.py
    value: "Path to AET backend configuration"
    reason: "sync.py must not imply a generic AET backend that could include ledger transport (R-18)"

  - type: must_not_contain
    target: docs/adr/054-plan-documents-are-outside-the-durability-gate.md
    value: "`status` remains the authoritative liveness signal"
    reason: "ADR-054 must not retain the stale clause that ADR-055 removed (R-18)"

  # owb-14 / R-18: agreed vocabulary lands in CONTEXT.md
  - type: must_contain
    target: CONTEXT.md
    section: "Language"
    value:
      - "**Task**"
      - "board entry"
      - "**Rendered Plan**"
      - "**Issue**"
      - "projection"
      - "**Board**"
      - "**Plan Backlog**"
      - "**Shadow Posture**"
    reason: "CONTEXT.md must carry the R-18 agreed vocabulary"

  # owb-14 / R-18: new ADR records the open-work board contract and shadow posture
  - type: path_exists
    target: docs/adr/063-open-work-board-contract-and-shadow-posture.md
    reason: "R-18 requires a new ADR recording the open-work board contract and shadow posture"

  - type: must_contain
    target: docs/adr/063-open-work-board-contract-and-shadow-posture.md
    value:
      - "ADR-011"
      - "ADR-013"
      - "ADR-045"
      - "ADR-055"
    reason: "The new ADR must name every decision it amends (R-18)"

  # cdc-03: CLI syntax must be generated or absent (R-4)
  - type: must_not_contain
    target: skills
    value: "## Options"
    reason: "CLI option references must be generated from the command tree or absent; never hand-copied (R-4)"

  - type: must_not_contain
    target: skills
    value:
      - "*str*"
      - "*boolean*"
      - "*int*"
      - "*path*"
      - "<str>"
      - "<int>"
      - "[default:"
    reason: "CLI option syntax must be generated from the command tree or absent; verbatim Typer/Click markers are hand-copied syntax (R-4)"

  # dcl-05: PRD code anchors must resolve to symbols, not line numbers (R-3, R-5, R-6)
  - type: code_anchor_resolves
    target: docs/prds
    reason: "Code anchors in PRDs must resolve to valid files and symbols, not line numbers (dcl-05)"
